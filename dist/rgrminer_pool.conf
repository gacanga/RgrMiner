# RgrMiner - RIGOR (ORU) on the Gozero pool (https://pool.gozero.trade/ORU). Pool rules: see the pool page.
# 1. pool-user = <your ORU receive address (rg1q...)>.<worker name: 1-48 letters, digits, _ or ->
#    Only your PUBLIC address is needed: never enter a private key or a wallet file here.
# 2. Optional, faster switch to the next block: run a RIGOR mainnet node on this computer and set
#    auth-file to its rpc-auth.conf (RgrMiner then watches the node for new blocks every 250 ms).
# 3. share-work = hashes per share. Aim for 0.5 to 1 share per second (smoother pool graph, same rewards):
#    about total hashrate in H/s x 1.25, e.g. 1e9 for one P104-100 (800 MH/s), 5e9 for five (4 GH/s).
pool-url = https://rgr.pool.gozero.trade/rpc
pool-user = YOUR_RIGOR_ADDRESS.rig01
pool-pass = x
share-work = 10000000000
ca-file = ca-bundle.crt
pool-poll-ms = 3000
tip-watch-ms = 250
share-threads = 4
# 4. report-hashrate = 1 sends the measured hashrate to the pool (shown on its site, no effect on rewards).
report-hashrate = 1
# auth-file = YOUR_RIGOR_DATA_FOLDER\rpc-auth.conf
gpus = all
tpb = 512
batch = 27
stats = 60
selfcheck = 10
