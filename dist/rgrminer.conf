# RgrMiner - RIGOR (ORU) solo mining on YOUR OWN local RIGOR mainnet node.
# 1. Run the official RIGOR v0.2 mainnet wallet / node on this computer and let it synchronize.
# 2. address   = a mainnet ORU receive address of your wallet (starts with rg1q).
# 3. auth-file = the rpc-auth.conf that the node writes in its data folder
#                (official Windows wallet: <wallet folder>\data\rpc-auth.conf),
#    or set rpc-user / rpc-pass instead.
address = YOUR_RIGOR_ADDRESS
auth-file = YOUR_RIGOR_DATA_FOLDER\rpc-auth.conf
# rpc-user =
# rpc-pass =
rpc-host = 127.0.0.1
rpc-port = 8761
gpus = all
tpb = 512
batch = 27
poll-ms = 500
stats = 60
selfcheck = 10
